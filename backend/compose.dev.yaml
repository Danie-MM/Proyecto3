# Alternativa para backend + BD. El compose.yaml raíz ya integra Angular.
name: petmatchcr-backend
services:
  db:
    image: postgres:15.19-bookworm@sha256:22c6356b2897cb0b4be6ad550b44ff97a0f29df7dbe327c01bc3c84bd457694d
    environment:
      POSTGRES_DB: petmatchcr
      POSTGRES_USER: petmatch_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copie backend/.env.example a backend/.env}
    volumes:
      - petmatchcr_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petmatch_app -d petmatchcr"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  backend:
    build: .
    image: petmatchcr-backend:dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/petmatchcr
      SPRING_DATASOURCE_USERNAME: petmatch_app
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Copie backend/.env.example a backend/.env}
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

volumes:
  petmatchcr_db:
