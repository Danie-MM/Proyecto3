name: Validar base Docker

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: base-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base-ejecutable:
    name: Compilacion, pruebas e integracion
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Cada ejecucion empieza con una base independiente y vacia.
      COMPOSE_PROJECT_NAME: petmatchcr-ci-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Preparar configuracion local de prueba
        run: |
          cp .env.example .env
          mkdir -p build/ci
          docker compose version
          docker compose config --quiet

      - name: Construir y encender los tres servicios
        id: arranque
        run: |
          docker compose up --build -d --wait --wait-timeout 240 2>&1 | tee build/ci/arranque.log
          docker compose ps

      - name: Ejecutar pruebas Angular
        if: ${{ !cancelled() && steps.arranque.outcome == 'success' }}
        run: docker compose exec -T frontend npm run test:ci 2>&1 | tee build/ci/frontend-tests.log

      - name: Ejecutar pruebas Java contra PostgreSQL
        if: ${{ !cancelled() && steps.arranque.outcome == 'success' }}
        run: docker compose exec -T backend ./gradlew test --no-daemon --rerun-tasks 2>&1 | tee build/ci/backend-tests.log

      - name: Guardar y consultar un dato mediante el proxy de Angular
        if: ${{ !cancelled() && steps.arranque.outcome == 'success' }}
        run: python3 scripts/verificar-integracion.py 2>&1 | tee build/ci/integracion.log

      - name: Recoger diagnostico y reportes
        if: always()
        run: |
          mkdir -p build/ci
          docker compose ps -a > build/ci/contenedores.log 2>&1 || true
          docker compose logs --no-color --tail 300 > build/ci/servicios.log 2>&1 || true
          docker compose cp backend:/app/build/test-results/test build/ci/junit || true
          docker compose cp backend:/app/build/reports/tests/test build/ci/reporte-java || true

      - name: Conservar resultados durante 7 dias
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resultados-base-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci/
          retention-days: 7
          if-no-files-found: warn

      - name: Detener los servicios
        if: always()
        run: docker compose down
