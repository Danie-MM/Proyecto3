components:
  schemas:
    "PruebaEntornoCrear":
      "type": "object"
      "additionalProperties": false
      "required":
        - "texto"
      "properties":
        "texto":
          "type": "string"
          "description": "Texto obligatorio. El servidor aplica String.strip y luego acepta de 1 a 80 puntos de código Unicode. Los espacios externos no cuentan; texto vacío, null, otro tipo o un valor normalizado de más de 80 caracteres produce 400. No se fija maxLength sobre el JSON sin normalizar, para permitir espacios externos válidos."
          "x-longitud-normalizada":
            "minimo": 1
            "maximo": 80
      "examples":
        -
          "texto": "Prueba de José"
        -
          "texto": "  Prueba de José  "
    "PruebaEntornoRespuesta":
      "type": "object"
      "additionalProperties": false
      "required":
        - "id"
        - "texto"
        - "creadoEn"
      "properties":
        "id":
          "$ref": "#/components/schemas/Uuid"
        "texto":
          "type": "string"
          "minLength": 1
          "maxLength": 80
          "description": "Texto normalizado; sin espacios externos."
        "creadoEn":
          "type": "string"
          "format": "date-time"
          "pattern": "Z$"
          "description": "Fecha generada por Spring, expresada en UTC y con precisión de microsegundos para coincidir con PostgreSQL."
      "examples":
        -
          "id": "11111111-1111-4111-8111-111111111111"
          "texto": "Prueba de José"
          "creadoEn": "2026-10-27T21:00:00.123456Z"
