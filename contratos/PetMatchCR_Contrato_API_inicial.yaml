openapi: 3.1.1
info:
  title: PetMatchCR - Contrato inicial I1
  version: 0.2.0
  description: Las rutas técnicas de arranque se implementan primero; las rutas A–E son diseño pendiente de implementación. Propuesta para adopción del equipo. Contratos de I1, no servicio desplegado. Las rutas I2 se documentan
    en el PDF y se incorporan antes de implementarlas. No incluye proveedor de pagos ni método de compatibilidad
    no ratificados. La autoridad de actor y permisos reside siempre en el servidor.
servers:
- url: /
  description: Mismo origen que la aplicación; no representa una URL desplegada.
tags:
- name: A
  description: Acceso
- name: B
  description: Mascotas y veterinaria
- name: C
  description: Ubicación y avisos
- name: D
  description: Adopciones
- name: E
  description: Ayudas
- name: Entorno técnico
  description: Comprobación de backend y BD; disponible solo en perfiles local o test.
paths:
  "/api/v1/pruebas-entorno":
    "post":
      "tags":
        - "Entorno técnico"
      "operationId": "crearPruebaEntorno"
      "summary": "Guardar un texto para comprobar Spring y PostgreSQL"
      "description": "Utilidad de arranque disponible únicamente con perfil local o test. Recibe solo texto; elimina espacios externos con String.strip y valida de 1 a 80 puntos de código Unicode después de normalizar. Spring genera UUID y fecha UTC, llama al procedimiento SQL y devuelve el registro realmente persistido. No requiere sesión ni token CSRF en estos perfiles. Las rutas funcionales de A–E conservan su contrato de seguridad y todavía no están implementadas."
      "x-perfiles":
        - "local"
        - "test"
      "x-fase": "Arranque"
      "security": []
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/PruebaEntornoCrear"
            "example":
              "texto": "Prueba de José"
      "responses":
        "201":
          "description": "Registro creado y almacenado en PostgreSQL."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/PruebaEntornoRespuesta"
              "example":
                "id": "11111111-1111-4111-8111-111111111111"
                "texto": "Prueba de José"
                "creadoEn": "2026-10-27T21:00:00.123456Z"
        "400":
          "description": "Datos inválidos. Corregir el campo indicado; no se guarda un registro."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorRespuesta"
              "examples":
                "textoInvalido":
                  "value":
                    "codigo": "VALIDACION"
                    "mensaje": "Revisá los datos enviados."
                    "erroresCampos":
                      -
                        "campo": "texto"
                        "mensaje": "Es obligatorio."
                    "trazaId": "22222222-2222-4222-8222-222222222222"
                "cuerpoInvalido":
                  "value":
                    "codigo": "SOLICITUD_INVALIDA"
                    "mensaje": "El cuerpo debe ser un objeto JSON con únicamente el campo texto de tipo string."
                    "erroresCampos":
                      -
                        "campo": "cuerpo"
                        "mensaje": "Revisá el formato JSON y el campo texto."
                    "trazaId": "22222222-2222-4222-8222-222222222222"
        "500":
          "description": "Fallo interno. No se exponen SQL, rutas, credenciales ni detalles de la excepción."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorRespuesta"
              "example":
                "codigo": "ERROR_INTERNO"
                "mensaje": "No pudimos completar la solicitud."
                "erroresCampos": []
                "trazaId": "22222222-2222-4222-8222-222222222222"
        "503":
          "description": "La BD no está disponible, pero Spring todavía puede responder. Si el backend está apagado o el proxy no devuelve JSON, el cliente debe mostrar un error de conexión."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorRespuesta"
              "example":
                "codigo": "BD_NO_DISPONIBLE"
                "mensaje": "La base de datos no está disponible. Intentá de nuevo."
                "erroresCampos": []
                "trazaId": "22222222-2222-4222-8222-222222222222"
  "/api/v1/pruebas-entorno/{id}":
    "get":
      "tags":
        - "Entorno técnico"
      "operationId": "consultarPruebaEntorno"
      "summary": "Consultar por UUID el texto guardado"
      "description": "Disponible únicamente con perfil local o test, sin sesión ni token CSRF. Lee el registro real de PostgreSQL a través de la función de consulta. Permite comprobar que los datos sobreviven al reinicio de los contenedores. No devuelve respuestas fijas de demostración."
      "x-perfiles":
        - "local"
        - "test"
      "x-fase": "Arranque"
      "security": []
      "parameters":
        -
          "name": "id"
          "in": "path"
          "required": true
          "description": "UUID devuelto por la operación de guardar."
          "schema":
            "$ref": "#/components/schemas/Uuid"
      "responses":
        "200":
          "description": "Registro encontrado."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/PruebaEntornoRespuesta"
              "example":
                "id": "11111111-1111-4111-8111-111111111111"
                "texto": "Prueba de José"
                "creadoEn": "2026-10-27T21:00:00.123456Z"
        "400":
          "description": "El identificador no tiene un formato UUID válido."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorRespuesta"
              "example":
                "codigo": "VALIDACION"
                "mensaje": "Revisá los datos enviados."
                "erroresCampos":
                  -
                    "campo": "id"
                    "mensaje": "Debe ser un UUID válido."
                "trazaId": "22222222-2222-4222-8222-222222222222"
        "404":
          "description": "UUID válido para el cual no existe ningún registro."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorRespuesta"
              "example":
                "codigo": "NO_ENCONTRADO"
                "mensaje": "No encontramos ese registro"
                "erroresCampos": []
                "trazaId": "22222222-2222-4222-8222-222222222222"
        "500":
          "description": "Fallo interno. No se exponen SQL, rutas, credenciales ni detalles de la excepción."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorRespuesta"
              "example":
                "codigo": "ERROR_INTERNO"
                "mensaje": "No pudimos completar la solicitud."
                "erroresCampos": []
                "trazaId": "22222222-2222-4222-8222-222222222222"
        "503":
          "description": "La BD no está disponible, pero Spring todavía puede responder. Si el backend está apagado o el proxy no devuelve JSON, el cliente debe mostrar un error de conexión."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorRespuesta"
              "example":
                "codigo": "BD_NO_DISPONIBLE"
                "mensaje": "La base de datos no está disponible. Intentá de nuevo."
                "erroresCampos": []
                "trazaId": "22222222-2222-4222-8222-222222222222"
  /api/v1/sesion/csrf:
    get:
      operationId: get_api_v1_sesion_csrf
      tags:
      - A
      summary: 200 {token:string}; crea o conserva sesión previa necesaria para CSRF.
      description: 'Cualquier visitante del mismo origen


        Token ligado a sesión, Cache-Control:no-store. En escrituras enviar X-CSRF-TOKEN; la cookie de sesión no
        se expone a JavaScript.


        Condiciones de entrada: Sin body.'
      x-fase: I1
      security: []
      parameters: []
      responses:
        '200':
          description: Resultado de la operación autorizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfRespuesta'
        '400':
          $ref: '#/components/responses/ErrorComun'
        '401':
          $ref: '#/components/responses/ErrorComun'
        '403':
          $ref: '#/components/responses/ErrorComun'
        '404':
          $ref: '#/components/responses/ErrorComun'
        '409':
          $ref: '#/components/responses/ErrorComun'
        '429':
          $ref: '#/components/responses/ErrorComun'
        '500':
          $ref: '#/components/responses/ErrorComun'
        '503':
          $ref: '#/components/responses/ErrorComun'
  /api/v1/usuarios:
    post:
      operationId: post_api_v1_usuarios
      tags:
      - A
      summary: 201 UsuarioRegistroRespuesta {id,nombre,correo,estado,creadoEn,version}; Location /api/v1/usuarios/{id}.
      description: 'Visitante


        No inicia sesión automáticamente; el usuario debe ingresar.

        Cuenta y aceptación se guardan juntas; 409 CORREO_REGISTRADO si colisión normalizada; no devolver hash.

        Solo campos listados; rechazar roles/ámbitos aportados por cliente.


        Condiciones de entrada: {nombre,correo,contrasena,aceptacionDatos:true,versionAvisoDatos}; Idempotency-Key
        UUID.'
      x-fase: I1
      security: []
      parameters:
      - name: X-CSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
          minLength: 1
        description: Obtener token de la sesión previa; renovar tras login/logout.
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
        description: 'Una clave por intención; reusar en reintento. Misma clave con otra entrada: 409.'
      responses:
        '201':
          description: Resultado de la operación autorizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioRegistroRespuesta'
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
              description: Referencia del recurso creado.
        '400':
          $ref: '#/components/responses/ErrorComun'
        '401':
          $ref: '#/components/responses/ErrorComun'
        '403':
          $ref: '#/components/responses/ErrorComun'
        '404':
          $ref: '#/components/responses/ErrorComun'
        '409':
          $ref: '#/components/responses/ErrorComun'
        '429':
          $ref: '#/components/responses/ErrorComun'
        '500':
          $ref: '#/components/responses/ErrorComun'
        '503':
          $ref: '#/components/responses/ErrorComun'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroUsuarioSolicitud'
            example: &id006
              nombre: Persona de prueba
              correo: persona@example.test
              contrasena: EjemploSeguro123!
              aceptacionDatos: true
              versionAvisoDatos: v0.1
    get:
      operationId: get_api_v1_usuarios
      tags:
      - A
      summary: 200 Pagina<UsuarioSeleccionRespuesta> {id,nombre,correo,estado}.
      description: 'Administrador


        I1 facilita seleccionar representante sin publicar directorio. Datos limitados al administrador.


        Condiciones de entrada: Query pagina,limite,correo? exacto normalizado; no búsqueda pública.'
      x-fase: I1
      security:
      - sesionCookie: []
      parameters:
      - name: pagina
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 0
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: correo
        in: query
        required: false
        schema:
          type: string
          format: email
          maxLength: 254
      responses:
        '200':
          description: Resultado de la operación autorizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaUsuarioSeleccionRespuesta'
        '400':
          $ref: '#/components/responses/ErrorComun'
        '401':
          $ref: '#/components/responses/ErrorComun'
        '403':
          $ref: '#/components/responses/ErrorComun'
        '404':
          $ref: '#/components/responses/ErrorComun'
        '409':
          $ref: '#/components/responses/ErrorComun'
        '429':
          $ref: '#/components/responses/ErrorComun'
        '500':
          $ref: '#/components/responses/ErrorComun'
        '503':
          $ref: '#/components/responses/ErrorComun'
  /api/v1/sesion:
    post:
      operationId: post_api_v1_sesion
      tags:
      - A
      summary: 200 SesionRespuesta {usuario:{id,nombre},roles:[{rol,organizacionId:null|UUID,empresaId:null|UUID}],venceEn:In
      description: 'Visitante


        Rotar id de sesión al autenticar; cookie PETMATCH_SESSION HttpOnly Secure SameSite=Lax.

        30 minutos de inactividad. 5 fallos en 15 minutos limita 15 minutos; 429 con Retry-After al limitar. 401
        mensaje genérico para credenciales inválidas/cuenta inactiva.

        No usar Idempotency-Key de negocio para conservar/reproducir credenciales o cookies; evitar reenvío automático
        y permitir consultar GET /sesion tras respuesta incierta.


        Condiciones de entrada: {correo,contrasena}; X-CSRF-TOKEN de sesión previa.'
      x-fase: I1
      security: []
      parameters:
      - name: X-CSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
          minLength: 1
        description: Obtener token de la sesión previa; renovar tras login/logout.
      responses:
        '200':
          description: Resultado de la operación autorizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionRespuesta'
              example: &id001
                usuario:
                  id: 11111111-1111-4111-8111-111111111111
                  nombre: Persona de prueba
                roles:
                - rol: REPRESENTANTE
                  organizacionId: 22222222-2222-4222-8222-222222222222
                  empresaId: null
                venceEn: '2026-10-26T18:30:00Z'
        '400':
          $ref: '#/components/responses/ErrorComun'
        '401':
          $ref: '#/components/responses/ErrorComun'
        '403':
          $ref: '#/components/responses/ErrorComun'
        '404':
          $ref: '#/components/responses/ErrorComun'
        '409':
          $ref: '#/components/responses/ErrorComun'
        '429':
          $ref: '#/components/responses/ErrorComun'
        '500':
          $ref: '#/components/responses/ErrorComun'
        '503':
          $ref: '#/components/responses/ErrorComun'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredencialesSolicitud'
    get:
      operationId: get_api_v1_sesion
      tags:
      - A
      summary: 200 SesionRespuesta vigente.
      description: 'Usuario autenticado


        401 si no existe, expiró o fue invalidada. Permisos se obtienen de su estado actual, no de un listado antiguo.


        Condiciones de entrada: Sin body.'
      x-fase: I1
      security:
      - sesionCookie: []
      parameters: []
      responses:
        '200':
          description: Resultado de la operación autorizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionRespuesta'
              example: *id001
        '400':
          $ref: '#/components/responses/ErrorComun'
        '401':
          $ref: '#/components/responses/ErrorComun'
        '403':
          $ref: '#/components/responses/ErrorComun'
        '404':
          $ref: '#/components/responses/ErrorComun'
        '409':
          $ref: '#/components/responses/ErrorComun'
        '429':
          $ref: '#/components/responses/ErrorComun'
        '500':
          $ref: '#/components/responses/ErrorComun'
        '503':
          $ref: '#/components/responses/ErrorComun'
  /api/v1/sesion/cierre:
    post:
      operationId: post_api_v1_sesion_cierre
      tags:
      - A
      summary: 200 {cerrada:true}.
      description: 'Usuario con sesión vigente.


        Invalidar sesión del servidor y expirar cookie. Una repetición sin sesión devuelve 401; nunca restaura la
        sesión.


        Condiciones de entrada: Sin body; X-CSRF-TOKEN obligatorio. Sin sesión vigente devuelve 401 y la interfaz
        vuelve a ingreso.'
      x-fase: I1
      security:
      - sesionCookie: []
      parameters:
      - name: X-CSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
          minLength: 1
        description: Obtener token de la sesión previa; renovar tras login/logout.
      responses:
        '200':
          description: Resultado de la operación autorizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CierreSesionRespuesta'
        '400':
          $ref: '#/components/responses/ErrorComun'
        '401':
          $ref: '#/components/responses/ErrorComun'
        '403':
          $ref: '#/components/responses/ErrorComun'
        '404':
          $ref: '#/components/responses/ErrorComun'
        '409':
          $ref: '#/components/responses/ErrorComun'
        '429':
          $ref: '#/components/responses/ErrorComun'
        '500':
          $ref: '#/components/responses/ErrorComun'
        '503':
          $ref: '#/components/responses/ErrorComun'
  /api/v1/usuarios/me:
    get:
      operationId: get_api_v1_usuarios_me
      tags:
      - A
      summary: 200 UsuarioPropioRespuesta {id,nombre,correo,estado,creadoEn,version}; sin hash.
      description: 'Usuario autenticado


        Solo titular. Cambio de correo/contraseña no se añade a alcance sin especificación.


        Condiciones de entrada: Sin body.'
      x-fase: I1
      security:
      - sesionCookie: []
      parameters: []
      responses:
        '200':
          description: Resultado de la operación autorizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioPropioRespuesta'
        '400':
          $ref: '#/components/responses/ErrorComun'
        '401':
          $ref: '#/components/responses/ErrorComun'
        '403':
          $ref: '#/components/responses/ErrorComun'
        '404':
          $ref: '#/components/responses/ErrorComun'
        '409':
          $ref: '#/components/responses/ErrorComun'
        '429':
          $ref: '#/components/responses/ErrorComun'
        '500':
          $ref: '#/components/responses/ErrorComun'
        '503':
          $ref: '#/components/responses/ErrorComun'
  /api/v1/organizaciones:
    get:
      operationId: get_api_v1_organizaciones
      tags:
      - A
      summary: 200 Pagina<OrganizacionPublicaRespuesta> {id,nombre,tipo,activa}; no expone contactos.
      description: 'Visitante: listado público de organizaciones activas. Administración ampliada en I2.


        No devolver correo/teléfono ni información administrativa en este listado público. La consulta de inactivas
        requiere ampliar el contrato administrativo I2.


        Condiciones de entrada: Query pagina,limite,soloActivas=true. En I1 se rechaza soloActivas=false.'
      x-fase: I1
      security: []
      parameters:
      - name: pagina
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 0
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: soloActivas
        in: query
        required: false
        schema:
          type: boolean
          const: true
          default: true
      responses:
        '200':
          description: Resultado de la operación autorizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaOrganizacionPublicaRespuesta'
        '400':
          $ref: '#/components/responses/ErrorComun'
        '401':
          $ref: '#/components/responses/ErrorComun'
        '403':
          $ref: '#/components/responses/ErrorComun'
        '404':
          $ref: '#/components/responses/ErrorComun'
        '409':
          $ref: '#/components/responses/ErrorComun'
        '429':
          $ref: '#/components/responses/ErrorComun'
        '500':
          $ref: '#/components/responses/ErrorComun'
        '503':
          $ref: '#/components/responses/ErrorComun'
  /api/v1/usuarios/{usuarioId}/roles:
    get:
      operationId: get_api_v1_usuarios_usuarioId_roles
      tags:
      - A
      summary: 200 Pagina<AsignacionRolRespuesta>.
      description: 'Administrador o titular


        Titular solo consulta sus propios ámbitos; no puede otorgárselos.


        Condiciones de entrada: Query pagina,limite,soloActivos=true.'
      x-fase: I1
      security:
      - sesionCookie: []
      parameters:
      - name: usuarioId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: pagina
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 0
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: soloActivos
        in: query
        required: false
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: Resultado de la operación autorizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaAsignacionRolRespuesta'
        '400':
          $ref: '#/components/responses/ErrorComun'
        '401':
          $ref: '#/components/responses/ErrorComun'
        '403':
          $ref: '#/components/responses/ErrorComun'
        '404':
          $ref: '#/components/responses/ErrorComun'
        '409':
          $ref: '#/components/responses/ErrorComun'
        '429':
          $ref: '#/components/responses/ErrorComun'
        '500':
          $ref: '#/components/responses/ErrorComun'
        '503':
          $ref: '#/components/responses/ErrorComun'
    post:
      operationId: post_api_v1_usuarios_usuarioId_roles
      tags:
      - A
      summary: 201 AsignacionRolRespuesta y Location.
      description: 'Administrador


        I1 solo REPRESENTANTE; I2 EMPRESA/VETERINARIO. ADMINISTRADOR fuera de este endpoint.

        Aplicar restricciones de entidad y unicidad; 409 ASIGNACION_ACTIVA_DUPLICADA. Asignación y auditoría atómicas.


        Condiciones de entrada: {rol,organizacionId:null|UUID,empresaId:null|UUID}; Idempotency-Key.'
      x-fase: I1
      security:
      - sesionCookie: []
      parameters:
      - name: usuarioId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: X-CSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
          minLength: 1
        description: Obtener token de la sesión previa; renovar tras login/logout.
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
        description: 'Una clave por intención; reusar en reintento. Misma clave con otra entrada: 409.'
      responses:
        '201':
          description: Resultado de la operación autorizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsignacionRolRespuesta'
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
              description: Referencia del recurso creado.
        '400':
          $ref: '#/components/responses/ErrorComun'
        '401':
